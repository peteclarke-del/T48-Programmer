<?xml version="1.0" encoding="UTF-8"?>
<!-- T48 Programmer application icon: a windowed EPROM in the programmer's
     green ZIF socket, with the lever down. Drawn by hand for this project and
     released under the same licence, GPL-3.0-or-later. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d4652"/>
      <stop offset="1" stop-color="#232a33"/>
    </linearGradient>
    <linearGradient id="socket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fbf7a"/>
      <stop offset="1" stop-color="#1f8a53"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3f"/>
      <stop offset="1" stop-color="#18181b"/>
    </linearGradient>
    <radialGradient id="window" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#ffe9b0"/>
      <stop offset="0.55" stop-color="#f6a23a"/>
      <stop offset="1" stop-color="#a8500f"/>
    </radialGradient>
  </defs>

  <!-- The programmer's case -->
  <rect x="8" y="8" width="112" height="112" rx="22" fill="url(#case)"/>
  <rect x="8" y="8" width="112" height="112" rx="22" fill="none" stroke="#11151a" stroke-width="2"/>

  <!-- The ZIF socket and its contact slots -->
  <rect x="22" y="22" width="84" height="92" rx="7" fill="url(#socket)" stroke="#14603a" stroke-width="2"/>
  <g fill="#14603a">
    <rect x="27" y="30" width="5" height="4" rx="1"/>
    <rect x="96" y="30" width="5" height="4" rx="1"/>
    <rect x="27" y="39" width="5" height="4" rx="1"/>
    <rect x="96" y="39" width="5" height="4" rx="1"/>
    <rect x="27" y="48" width="5" height="4" rx="1"/>
    <rect x="96" y="48" width="5" height="4" rx="1"/>
    <rect x="27" y="57" width="5" height="4" rx="1"/>
    <rect x="96" y="57" width="5" height="4" rx="1"/>
    <rect x="27" y="66" width="5" height="4" rx="1"/>
    <rect x="96" y="66" width="5" height="4" rx="1"/>
    <rect x="27" y="75" width="5" height="4" rx="1"/>
    <rect x="96" y="75" width="5" height="4" rx="1"/>
    <rect x="27" y="84" width="5" height="4" rx="1"/>
    <rect x="96" y="84" width="5" height="4" rx="1"/>
    <rect x="27" y="93" width="5" height="4" rx="1"/>
    <rect x="96" y="93" width="5" height="4" rx="1"/>
    <rect x="27" y="102" width="5" height="4" rx="1"/>
    <rect x="96" y="102" width="5" height="4" rx="1"/>
  </g>

  <!-- The lever, down and locked, with its knob -->
  <rect x="100" y="12" width="6" height="16" rx="3" fill="#c9ced6"/>
  <circle cx="103" cy="12" r="6" fill="#e8ebef" stroke="#8a929e" stroke-width="1.5"/>

  <!-- The chip: legs, body, the pin 1 notch and the quartz window -->
  <g fill="#c9ced6">
    <rect x="33" y="37" width="9" height="5" rx="1"/>
    <rect x="86" y="37" width="9" height="5" rx="1"/>
    <rect x="33" y="46" width="9" height="5" rx="1"/>
    <rect x="86" y="46" width="9" height="5" rx="1"/>
    <rect x="33" y="55" width="9" height="5" rx="1"/>
    <rect x="86" y="55" width="9" height="5" rx="1"/>
    <rect x="33" y="64" width="9" height="5" rx="1"/>
    <rect x="86" y="64" width="9" height="5" rx="1"/>
    <rect x="33" y="73" width="9" height="5" rx="1"/>
    <rect x="86" y="73" width="9" height="5" rx="1"/>
    <rect x="33" y="82" width="9" height="5" rx="1"/>
    <rect x="86" y="82" width="9" height="5" rx="1"/>
    <rect x="33" y="91" width="9" height="5" rx="1"/>
    <rect x="86" y="91" width="9" height="5" rx="1"/>
  </g>
  <rect x="41" y="31" width="46" height="70" rx="4" fill="url(#chip)" stroke="#0c0c0e" stroke-width="1.5"/>
  <path d="M 57 31 a 7 7 0 0 0 14 0 z" fill="#0c0c0e"/>
  <circle cx="64" cy="68" r="13" fill="#0c0c0e"/>
  <circle cx="64" cy="68" r="11" fill="url(#window)"/>
  <rect x="58" y="62" width="12" height="12" rx="1.5" fill="#5b2a06" opacity="0.55"/>
  <path d="M 56 61 a 11 11 0 0 1 9 -4" fill="none" stroke="#fff6dc" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
</svg>
